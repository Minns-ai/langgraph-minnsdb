[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-minnsdb"
version = "0.1.1"
description = "LangGraph long-term memory on MinnsDB: a store that keeps every version, and graph memory that knows which facts are current."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Minns" }]
keywords = ["langgraph", "langchain", "memory", "agents", "minnsdb", "temporal", "knowledge-graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Minns-ai/langgraph-minnsdb"
Repository = "https://github.com/Minns-ai/langgraph-minnsdb"
MinnsDB = "https://github.com/Minns-ai/MinnsDB"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_minnsdb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: needs a running MinnsDB (set MINNSDB_URL)", "llm: needs MinnsDB with an LLM configured for ingestion"]
